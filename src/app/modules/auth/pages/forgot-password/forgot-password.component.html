
<div class="flex flex-col items-center justify-center px-6 pt-8 mx-auto md:h-screen pt:mt-0 dark:bg-gray-900">
    <a href="/propiedades" class="flex items-center justify-center mb-8 text-2xl font-semibold lg:mb-10 dark:text-white">
        <img src="/assets/images/logo_rocio.svg" class="mr-4 h-11" alt="FlowBite Logo">
        <span>Rocío Inmuebles</span>
    </a>
    <div class="w-full bg-white rounded-lg shadow md:mt-0 sm:max-w-md xl:p-0 dark:bg-gray-800">
        <div class="w-full p-6 sm:p-8">
            <h2 class="mb-3 text-2xl font-bold text-gray-900 dark:text-white">
                Olvidaste tu contraseña?
            </h2>
            <p class="text-base font-normal text-gray-500 dark:text-gray-400">
                Solo escribe tu email y te enviaremos un código para reestablecer tu contraseña
            </p>
            <form [formGroup]="form" class="mt-8 space-y-6" (submit)="onSubmit()">
                <div>
                    <label for="email" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tu correo electrónico</label>
                    <input formControlName="email" type="email" name="email" id="email" class="bg-gray-50 border border-gray-300 text-gray-900 sm:text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5" placeholder="name@company.com" required>
                </div>
                <button type="submit" class="w-full px-5 py-3 text-base font-medium text-center text-white rounded-lg bg-amarillo-rocio hover:bg-amarillo-rocio/80 focus:ring-4 focus:ring-primary-300 sm:w-auto">Reestablecer contraseña</button>
            </form>
        </div>
    </div>
</div>
